<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#041E42">
  <title>Movie connections</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23041E42'/%3E%3Cpath d='M10 12L29 20L10 29' stroke='%23DEC47E' stroke-width='3' fill='none'/%3E%3Ccircle cx='10' cy='12' r='5' fill='%238FBDD2'/%3E%3Ccircle cx='10' cy='29' r='5' fill='%238FBDD2'/%3E%3Crect x='24' y='15' width='10' height='10' fill='%23DEC47E'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="app" class="app">
  <header class="topbar">
    <div class="brand"><h1 id="title">Movie connections</h1><span id="progress" class="progress"></span></div>
    <nav class="tools" aria-label="Game controls">
      <button id="help" type="button"></button>
      <button id="sound" type="button" aria-pressed="false"></button>
    </nav>
  </header>
  <section id="play">
    <div class="task">
      <p id="round-title" class="round-title"></p>
      <h2 id="question" tabindex="-1"></h2>
      <p id="instruction"></p>
      <div class="taskbar"><span id="rule" class="rule"></span><button id="credits-open" type="button"></button></div>
      <div id="claim" class="claim" hidden></div>
    </div>
    <div class="play-layout">
      <section class="graph-panel" aria-labelledby="question">
        <div class="actions"><button id="undo" type="button"></button><button id="reset" type="button"></button><button id="check" class="primary" type="button"></button></div>
        <div class="legend" id="legend">
          <span><i class="person-key"></i><span id="person-label"></span></span>
          <span><i class="film-key"></i><span id="film-label"></span></span>
          <span><i class="line-key"></i><span id="acted-label"></span></span>
          <span><i class="line-key directed"></i><span id="directed-label"></span></span>
        </div>
        <div id="board" class="board" role="group">
          <svg id="lines" aria-hidden="true"><defs><marker id="arrow-actor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8FBDD2"/></marker><marker id="arrow-director" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#DEC47E"/></marker></defs><g id="edges"></g></svg>
          <div id="nodes"></div>
        </div>
        <div class="route-panel">
          <div class="route-heading"><h3 id="route-title"></h3><span id="route-count"></span></div>
          <ol id="route" class="route"></ol>
        </div>
        <section id="feedback" class="feedback" aria-live="polite" aria-atomic="true"></section>
        <section id="facts" class="facts" hidden></section>
      </section>
      <aside id="credit-panel" class="credit-panel"><h3 id="credits-title"></h3><p id="credits-help"></p><div id="credits-list"></div></aside>
    </div>
    <footer class="page-footer"><span id="saved"></span><button id="sources" type="button"></button></footer>
  </section>
  <section id="results" class="results" hidden></section>
  <section id="workshop" hidden></section>
  <dialog id="dialog"><div id="dialog-content"></div><button id="dialog-close" class="primary" type="button"></button></dialog>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
